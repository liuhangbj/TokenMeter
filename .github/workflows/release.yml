name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      # Rust 编译缓存：第二次起依赖层直接复用，构建时间大幅缩短
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: "TokenMeter v__VERSION__"
          releaseBody: "见下方各平台安装包。"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false  # latest.json 由 merge job 用 .sig 签名构造后统一上传

  # 构造 latest.json 并上传到 Release：
  # Tauri CLI 只生成 .sig 签名文件（不生成 latest.json），latest.json 是
  # tauri-action 在 includeUpdaterJson: true 时的产物，且多平台会互相覆盖。
  # 因此这里直接从 Release 拿各平台 .sig 签名 + asset URL，用 Python 组装一份
  # 完整的 latest.json（darwin-aarch64 / windows-x86_64），这是最可靠的方式。
  merge-updater-json:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get tag version
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download .sig files and build latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p sigs
          # 下载全部 .sig 签名文件
          gh release download "$TAG" --pattern "*.sig" --dir sigs 2>/dev/null || true
          ls -la sigs/

          python3 - <<'EOF'
          import json, os, subprocess, datetime, re

          tag = "${{ steps.tag.outputs.tag }}"
          repo = "${{ github.repository }}"
          assets = json.loads(subprocess.check_output(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "assets,createdAt"],
              text=True))["assets"]
          created = json.loads(subprocess.check_output(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "createdAt"], text=True))["createdAt"]

          def asset(name):
              for a in assets:
                  if a["name"] == name:
                      return a
              return None

          platforms = {}
          # macOS Apple Silicon：Tauri CLI 只给 app.tar.gz 生成 .sig（DMG 无签名），
          # 因此更新包指向 app.tar.gz（Tauri updater 原生支持该格式）
          APP_GZ = "TokenMeter_aarch64.app.tar.gz"
          appgz = asset(APP_GZ)
          appgz_sig = asset(APP_GZ + ".sig")
          if appgz and appgz_sig:
              sig = open(f"sigs/{appgz_sig['name']}").read().strip()
              platforms["darwin-aarch64"] = {"signature": sig, "url": appgz["browser_download_url"]}
          # Windows x64：NSIS exe（Tauri v2 updater 优先 NSIS）+ 对应 .sig
          exe = asset(f"TokenMeter_{tag[1:]}_x64-setup.exe")
          exe_sig = asset(f"TokenMeter_{tag[1:]}_x64-setup.exe.sig")
          if exe and exe_sig:
              sig = open(f"sigs/{exe_sig['name']}").read().strip()
              platforms["windows-x86_64"] = {"signature": sig, "url": exe["browser_download_url"]}

          latest = {
              "version": tag[1:],
              "notes": "TokenMeter " + tag,
              "pub_date": created,
              "platforms": platforms,
          }
          json.dump(latest, open("latest.json", "w"), indent=2)
          print("latest.json platforms:", list(platforms.keys()))
          EOF

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release upload "$TAG" latest.json --clobber
          echo "=== Release assets ==="
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep latest
