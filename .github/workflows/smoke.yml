# Windows 冒烟测试（PR 自动运行，也可手动触发）：云端 Windows 机器自动验证
# 用户没有 Windows 环境也不装虚拟机，用 GitHub Actions 的 windows runner 做真实测试。
#
# 验证项：
#  1. App 能正常启动且进程存活（不崩）
#  2. 启动后零可见窗口（MainWindowHandle == 0）→ 纯菜单栏架构生效
#  3. 进程持续存活（scheduler 正常运行，无 panic）
#  4. 自动显示面板后宽度为 380（按 DPI 缩放）、高度按内容自适应，
#     且始终贴在工作区右下角
#  5. 上传真实 Windows 面板截图，供 WebView2 白屏/渲染回归检查
#
# 局限：仍无法模拟系统托盘图标点击/右键菜单。
name: Windows Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/win/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/smoke.yml"

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build release binary
        # 必须启用 custom-protocol：否则 release exe 仍是 dev 模式，
        # 面板会去连 localhost:1420 导致"无法访问此页面"。
        run: cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml

      # 上传编译产物：本机没有 Windows 环境时，从这里取 exe 做真机部署/测试
      - name: Upload dev binary
        uses: actions/upload-artifact@v4
        with:
          name: tokenmeter-windows-x64
          path: src-tauri/target/release/tokenmeter.exe
          if-no-files-found: error

      - name: Launch app (background)
        shell: pwsh
        env:
          TOKENMETER_LOG_FILE: ${{ github.workspace }}\app.log
        run: |
          $exe = "$PWD\src-tauri\target\release\tokenmeter.exe"
          if (-not (Test-Path $exe)) { throw "exe 不存在: $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Output "STARTED PID=$($proc.Id)"
          Set-Content -Path "$PWD\pid.txt" -Value $proc.Id

      - name: Assert process alive and zero windows
        timeout-minutes: 3
        shell: pwsh
        run: |
          $pid2 = [int](Get-Content "$PWD\pid.txt")
          Start-Sleep -Seconds 8
          $p = Get-Process -Id $pid2 -ErrorAction SilentlyContinue
          if (-not $p) { throw "FAIL: App 启动后崩溃退出" }
          Write-Output "PASS: 进程存活 (PID $pid2)"
          Write-Output "INFO: MainWindowHandle=$($p.MainWindowHandle) MainWindowTitle='$($p.MainWindowTitle)'"
          # 关键：tao 框架在 Windows 上总会创建一个"消息窗口"（消息泵，尺寸 0、
          # 屏幕外、无标题、用户不可见），.NET 的 MainWindowHandle 会误判它为
          # "可见窗口"。单实例插件还会创建一个标题为 "<identifier>-siw" 的
          # 隐藏消息窗口。真正的用户可见窗口（崩溃框/面板/向导）必然带其他非空标题。
          # 因此断言：handle 非 0 且标题为空或 -siw 结尾 → 框架消息窗口，视为正常通过。
          $siw = $p.MainWindowTitle -like '*-siw'
          if ($p.MainWindowHandle -ne 0 -and $p.MainWindowTitle -ne '' -and -not $siw) {
            throw "FAIL: 存在用户可见窗口 title='$($p.MainWindowTitle)'"
          }
          Write-Output "PASS: 无用户可见窗口"

      - name: Assert app stays alive (18s total)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $pid2 = [int](Get-Content "$PWD\pid.txt")
          Start-Sleep -Seconds 10
          $p = Get-Process -Id $pid2 -ErrorAction SilentlyContinue
          if (-not $p) { throw "FAIL: App 运行 18 秒后崩溃" }
          Write-Output "PASS: 运行 18 秒仍存活"

      - name: Stop hidden-start instance
        shell: pwsh
        run: |
          $pid2 = [int](Get-Content "$PWD\pid.txt")
          Stop-Process -Id $pid2 -Force -ErrorAction SilentlyContinue

      - name: Assert visible panel geometry and capture screenshot
        timeout-minutes: 3
        shell: pwsh
        run: |
          $exe = "$PWD\src-tauri\target\release\tokenmeter.exe"
          & "$PWD\scripts\win\smoke-panel.ps1" -Exe $exe -OutDir "$PWD\smoke-visible"

      - name: Show app log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$PWD\app.log") {
            Write-Output "=== app.log ==="
            Get-Content "$PWD\app.log" -Tail 30
          } else {
            Write-Output "WARN: app.log 未生成"
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $pid2 = [int](Get-Content "$PWD\pid.txt")
          Stop-Process -Id $pid2 -Force -ErrorAction SilentlyContinue
          Write-Output "CLEANED"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: |
            app.log
            pid.txt
            smoke-visible/**
          if-no-files-found: ignore
