[package]
name = "tokenmeter"
version = "0.9.2"
description = "Cross-platform menu bar app for monitoring AI token/quota usage"
authors = ["hangbits"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
rand = "0.8"
base64 = "0.22"
hostname = "0.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[features]
# 生产/独立二进制必需：启用后前端资源内嵌进 exe（custom protocol），
# 否则即使 release 构建也会按 dev 模式去连 devUrl（localhost:1420），
# 托盘面板会报"无法访问此页面 / localhost 拒绝连接"。
custom-protocol = ["tauri/custom-protocol"]
# 默认不开启系统托盘原生菜单（我们手动构建）
default = []
